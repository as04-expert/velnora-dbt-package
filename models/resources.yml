        change_reason: "{{ 'string' if target.type in ['bigquery', 'databricks', 'spark'] else 'varchar' }}"
        source_updated_at: "{{ 'string' if target.type in ['bigquery', 'databricks', 'spark'] else 'varchar' }}"
