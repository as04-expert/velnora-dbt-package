version: 2
seeds:
  - name: raw_accounts
    description: "CRM account state at the fixed fixture cutoff. One row per fictional account."
    config:
      column_types:
        account_id: "{{ 'string' if target.type in ['bigquery', 'databricks', 'spark'] else 'varchar' }}"
        account_name: "{{ 'string' if target.type in ['bigquery', 'databricks', 'spark'] else 'varchar' }}"
        industry: "{{ 'string' if target.type in ['bigquery', 'databricks', 'spark'] else 'varchar' }}"
        region: "{{ 'string' if target.type in ['bigquery', 'databricks', 'spark'] else 'varchar' }}"
        country_code: "{{ 'string' if target.type in ['bigquery', 'databricks', 'spark'] else 'varchar' }}"
        customer_tier: "{{ 'string' if target.type in ['bigquery', 'databricks', 'spark'] else 'varchar' }}"
        payment_terms_days: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        credit_limit_usd_cents: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        account_status: "{{ 'string' if target.type in ['bigquery', 'databricks', 'spark'] else 'varchar' }}"
        created_at: "{{ 'string' if target.type in ['bigquery', 'databricks', 'spark'] else 'varchar' }}"
        updated_at: "{{ 'string' if target.type in ['bigquery', 'databricks', 'spark'] else 'varchar' }}"
        source_system: "{{ 'string' if target.type in ['bigquery', 'databricks', 'spark'] else 'varchar' }}"
    columns:
      - name: account_id
        description: "account id"
      - name: account_name
        description: "account name"
      - name: industry
        description: "industry"
      - name: region
        description: "region"
      - name: country_code
        description: "country code"
      - name: customer_tier
        description: "customer tier"
      - name: payment_terms_days
        description: "payment terms days"
      - name: credit_limit_usd_cents
        description: "Integer USD cents. Blank means not yet available."
      - name: account_status
        description: "account status"
      - name: created_at
        description: "UTC timestamp text. Blank is null."
      - name: updated_at
        description: "UTC timestamp text. Blank is null."
      - name: source_system
        description: "source system"
