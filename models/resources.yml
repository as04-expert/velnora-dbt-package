models:
  - name: stg_accounts
    description: "CRM account dimension. Current values retain source names and business segments."
    config:
      meta:
        owner: data_platform
        lifecycle: maintained
  - name: stg_orders
    description: "ERP order headers cast to dates and timestamps. Cancelled rows retained."
    config:
      meta:
        owner: revenue_operations
        lifecycle: maintained
  - name: stg_order_items
    description: "Ordered quantities and unit economics in integer USD cents."
    config:
      meta:
        owner: finance_analytics
        lifecycle: maintained
  - name: stg_carrier_events
    description: "Event-ID replay removal. Unknown raw statuses remain explicitly unmapped."
    config:
      meta:
        owner: logistics_analytics
        lifecycle: maintained
  - name: fct_orders
    description: "One row per order, merged by order_id. Item values are aggregated before event join; last scan uses occurrence time; customer tier is joined at order time. Schema changes require an explicit migration and historical rebuild."
    config:
      meta:
        owner: logistics_analytics
        lifecycle: maintained
    columns:
      - name: is_open_order
        description: "1 for confirmed, processing, or in-transit orders; 0 for fulfilled or cancelled orders. Recomputed for the full retained history during a migration."
  - name: fct_invoice_lines
    description: "Invoice line fact. Exact business replays are collapsed while ingestion lineage retains the latest landing row."
    config:
      meta:
        owner: finance_analytics
        lifecycle: maintained
  - name: dim_account_history
    description: "Type 2 account history from supplied effective changes. Half-open validity intervals."
    config:
      meta:
        owner: data_platform
        lifecycle: maintained
  - name: mart_daily_operations
    description: "Order-date cohorts with booked demand, delivery SLA and return requests as of fixed cutoff. Bookings are not recognized revenue."
    config:
      meta:
        owner: operations_analytics
        lifecycle: maintained
  - name: bronze_returns_enrichment
    description: "Disabled draft. Parses typed envelope only. Serial extraction and disposition mapping remain unfinished."
    config:
      meta:
        owner: support_data
        lifecycle: draft
  - name: bronze_invoice_allocations
    description: "Disabled draft. Freight allocation work has no approved rule or freight source. Not ready for reporting."
    config:
      meta:
        owner: finance_analytics
        lifecycle: draft
