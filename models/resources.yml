    description: "ERP sales order header. Forty-eight orders; cancelled orders retain their original lines."
    config:
      column_types:
        order_id: "{{ 'string' if target.type in ['bigquery', 'databricks', 'spark'] else 'varchar' }}"
        account_id: "{{ 'string' if target.type in ['bigquery', 'databricks', 'spark'] else 'varchar' }}"
        ordered_at: "{{ 'string' if target.type in ['bigquery', 'databricks', 'spark'] else 'varchar' }}"
